<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.P.R.I. Cyberpunk Interface</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161920;
            --accent-green: #00ff66;
            --accent-cyan: #00e5ff;
            --accent-red: #ff0055;
            --text-color: #c5d1de;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        header {
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--accent-cyan);
            margin: 0;
            font-size: 1.5rem;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        .status-badge {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 4px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .voice-btn {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            border: 1px solid #ff0055;
            padding: 5px 12px;
            border-radius: 4px;
            font-family: var(--font-family);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .voice-btn.active {
            background: rgba(0, 255, 102, 0.2);
            color: #00ff66;
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        .chat-section {
            background: var(--panel-bg);
            border: 1px solid #2a303c;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 4px;
            max-width: 80%;
            line-height: 1.4;
        }

        .user-msg {
            background: rgba(0, 229, 255, 0.1);
            border-left: 3px solid var(--accent-cyan);
            align-self: flex-end;
        }

        .bot-msg {
            background: rgba(0, 255, 102, 0.1);
            border-left: 3px solid var(--accent-green);
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #090a0c;
            border: 1px solid #2a303c;
            color: var(--text-color);
            padding: 10px;
            font-family: var(--font-family);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
        }

        button {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: var(--font-family);
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .sidebar {
            background: var(--panel-bg);
            border: 1px solid #2a303c;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h2 {
            color: var(--accent-green);
            font-size: 1rem;
            margin-top: 0;
            border-bottom: 1px solid #2a303c;
            padding-bottom: 5px;
        }

        .skill-btn {
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            width: 100%;
            text-align: left;
            padding: 8px;
            margin-bottom: 5px;
        }

        .skill-btn:hover {
            background: var(--accent-green);
            color: #000;
        }

        .output-box {
            background: #090a0c;
            border: 1px solid #2a303c;
            padding: 10px;
            font-size: 0.75rem;
            white-space: pre-wrap;
            color: #aaa;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 C.A.P.R.I. // SYSTEM_HUD</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="voiceBtn" class="voice-btn" onclick="toggleVoiceMute()">🎤 MIC: SILENCIADO</button>
            <div class="status-badge" id="statusBadge">CONECTANDO WEBSOCKET...</div>
        </div>
    </header>

    <div class="main-container">
        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="message bot-msg">
                    <strong>[C.A.P.R.I.]:</strong> Enlace neural listo, choom. Streaming de tokens y ciberware activo.
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Escribe una directiva o pregunta táctica..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">ENVIAR</button>
            </div>
        </div>

        <div class="sidebar">
            <h2>HABILIDADES</h2>
            <button class="skill-btn" onclick="runSkill('system_monitor')">⚡ Telemetría (RAM/Disco)</button>
            <button class="skill-btn" onclick="runSkill('power_control', {action: 'battery'})">🔋 Batería & Brillo</button>
            <button class="skill-btn" onclick="runSkill('process_manager', {action: 'top_cpu'})">⚙️ Procesos Top CPU</button>
            <button class="skill-btn" onclick="runSkill('network_info', {action: 'ping'})">🌐 Diagnóstico Red Ping</button>
            <button class="skill-btn" onclick="runSkill('clipboard', {action: 'paste'})">📋 Leer Portapapeles</button>
            <button class="skill-btn" onclick="runSkill('quick_notes', {action: 'list'})">📝 Bloc de Notas / Tareas</button>
            <button class="skill-btn" onclick="runSkill('screenshot', {})">📸 Captura Óptica (Kiroshi)</button>
            <button class="skill-btn" onclick="runSkill('package_manager', {action: 'updates'})">📦 Actualizaciones APT</button>
            <button class="skill-btn" onclick="runSkill('media_control', {action: 'status'})">🎵 Estado Multimedia</button>
            <button class="skill-btn" onclick="runSkill('git_assistant', {action: 'status'})">🐙 Estado Git Local</button>

            <h2>📱 WHATSAPP</h2>
            <button class="skill-btn" onclick="runSkill('whatsapp', {action: 'inbox'})">💬 Bandeja WhatsApp</button>
            <button class="skill-btn" onclick="runSkill('whatsapp', {action: 'contacts_list'})">📒 Contactos Guardados</button>

            <h2>TELEMETRÍA EN VIVO</h2>
            <div class="output-box" id="techOutput">Esperando ejecuciones tácticas...</div>
        </div>
    </div>

    <script>
        const sessionId = "web_session_" + Math.floor(Math.random() * 10000);
        const statusBadge = document.getElementById('statusBadge');
        const techOutput = document.getElementById('techOutput');
        let currentBotMsgElement = null;
        let ws = null;

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusBadge.innerText = "⚡ WS STREAMING ONLINE";
                statusBadge.style.borderColor = "var(--accent-green)";
                statusBadge.style.color = "var(--accent-green)";
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleStreamEvent(data);
                } catch (e) {
                    console.error("Error parseando evento WS:", e);
                }
            };

            ws.onclose = () => {
                statusBadge.innerText = "REST FALLBACK (WS DESCONECTADO)";
                statusBadge.style.borderColor = "var(--accent-cyan)";
                statusBadge.style.color = "var(--accent-cyan)";
                setTimeout(initWebSocket, 4000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function handleStreamEvent(data) {
            const chatBox = document.getElementById('chatBox');

            if (data.type === 'status') {
                techOutput.innerText = `[ESTADO]: ${data.message || data.stage}`;
            } else if (data.type === 'skill_call') {
                techOutput.innerText = `⚡ [ACTIVANDO CIBERWARE]: ${data.skill}\nParámetros: ${JSON.stringify(data.params, null, 2)}`;
            } else if (data.type === 'skill_result') {
                techOutput.innerText += `\n\n✔ [RESULTADO]: ${JSON.stringify(data.result, null, 2)}`;
            } else if (data.type === 'token') {
                if (!currentBotMsgElement) {
                    currentBotMsgElement = document.createElement('div');
                    currentBotMsgElement.className = 'message bot-msg';
                    currentBotMsgElement.innerHTML = `<strong>[C.A.P.R.I.]:</strong> <span class="content"></span>`;
                    chatBox.appendChild(currentBotMsgElement);
                }
                const span = currentBotMsgElement.querySelector('.content');
                span.innerText += data.delta;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else if (data.type === 'done') {
                currentBotMsgElement = null;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else if (data.type === 'error') {
                appendMessage(`[ERROR]: ${data.message}`, 'bot-msg', 'SYSTEM');
                currentBotMsgElement = null;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, 'user-msg', 'Tú');
            input.value = '';
            currentBotMsgElement = null;

            // Si WebSocket está abierto, transmitir por WS
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ session_id: sessionId, message: message }));
            } else {
                // Fallback REST
                try {
                    const res = await fetch('/api/v1/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, message: message })
                    });
                    const data = await res.json();
                    appendMessage(data.response, 'bot-msg', 'C.A.P.R.I.');
                } catch (err) {
                    appendMessage("Error de conexión con el backend.", 'bot-msg', 'SYSTEM');
                }
            }
        }

        function appendMessage(text, className, sender) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>[${sender}]:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function runSkill(skillName, params = {}) {
            techOutput.innerText = `Ejecutando ${skillName}...`;
            try {
                const res = await fetch('/api/v1/skills/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ skill_name: skillName, params: params })
                });
                const data = await res.json();
                techOutput.innerText = JSON.stringify(data.result, null, 2);
            } catch (err) {
                techOutput.innerText = "Error ejecutando habilidad.";
            }
        }

        // ── CONTROL DE VOZ Y WAKE WORD ("Oye Capri") ────────────────────────
        let isVoiceMuted = true;
        let speechRecognizer = null;

        async function initVoiceState() {
            try {
                const res = await fetch('/api/v1/voice/status');
                const data = await res.json();
                isVoiceMuted = data.is_muted;
                updateVoiceBtnUI();
                if (!isVoiceMuted) startSpeechRecognition();
            } catch (e) {
                console.warn("No se pudo sincronizar estado de voz inicial:", e);
            }
        }

        async function toggleVoiceMute() {
            try {
                const res = await fetch('/api/v1/voice/toggle_mute', { method: 'POST' });
                const data = await res.json();
                isVoiceMuted = data.is_muted;
                updateVoiceBtnUI();
                if (!isVoiceMuted) {
                    startSpeechRecognition();
                } else {
                    stopSpeechRecognition();
                }
            } catch (e) {
                console.error("Error al alternar mute:", e);
            }
        }

        function updateVoiceBtnUI() {
            const btn = document.getElementById('voiceBtn');
            if (!btn) return;
            if (isVoiceMuted) {
                btn.className = 'voice-btn';
                btn.innerText = '🎤 MIC: SILENCIADO';
            } else {
                btn.className = 'voice-btn active';
                btn.innerText = '🔴 ESCUCHANDO ("Oye Capri")';
            }
        }

        function startSpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                console.warn("Este navegador no soporta Web Speech API nativa.");
                return;
            }
            if (speechRecognizer) {
                try { speechRecognizer.stop(); } catch(e){}
            }
            speechRecognizer = new SpeechRec();
            speechRecognizer.continuous = true;
            speechRecognizer.interimResults = false;
            speechRecognizer.lang = 'es-ES';

            speechRecognizer.onresult = (evt) => {
                for (let i = evt.resultIndex; i < evt.results.length; ++i) {
                    if (evt.results[i].isFinal) {
                        const transcript = evt.results[i][0].transcript.trim();
                        handleVoiceTranscript(transcript);
                    }
                }
            };

            speechRecognizer.onend = () => {
                if (!isVoiceMuted) {
                    setTimeout(() => {
                        try { speechRecognizer.start(); } catch(e){}
                    }, 400);
                }
            };

            try { speechRecognizer.start(); } catch (e) { console.warn("Reconocimiento ya activo:", e); }
        }

        function stopSpeechRecognition() {
            if (speechRecognizer) {
                try { speechRecognizer.stop(); } catch(e){}
                speechRecognizer = null;
            }
        }

        function handleVoiceTranscript(text) {
            const lower = text.toLowerCase();
            const wakePatterns = [/oye capri/i, /hey capri/i, /hola capri/i, /ok capri/i, /^capri\b/i];
            let matched = false;
            let command = text;

            for (const p of wakePatterns) {
                if (p.test(lower)) {
                    matched = true;
                    command = text.replace(p, '').replace(/^[\s,;:\.¿\?!]+/, '').trim();
                    break;
                }
            }

            if (matched || !isVoiceMuted) {
                const finalCmd = command || text;
                const input = document.getElementById('userInput');
                input.value = finalCmd;
                sendMessage();
            }
        }

        window.addEventListener('load', () => {
            initWebSocket();
            initVoiceState();
        });
    </script>
</body>
</html>
